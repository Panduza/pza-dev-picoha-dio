[package]
edition = "2021"
name = "pza-dev-picoha-dio"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
critical-section = "1.1"
embedded-hal = { version = "1.0.0" }

heapless = "0.8.0"

irq = "0.2.3"

femtopb = "0.6.0"
serial-line-ip = { git = "https://github.com/Panduza/serial-line-ip-rs", branch = "stream_buffer_feature" }

fugit = "0.3.7"

rp2040-flash = "0.5.1"

defmt = "0.3"
defmt-rtt = "0.4"
embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }
embassy-futures = { version = "0.1.0" }
embassy-usb = { version = "0.4.0", features = ["defmt"] }
embassy-usb-logger = { version = "0.4.0" }
embassy-executor = { version = "0.7.0", features = ["task-arena-size-98304", "arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.3.0", features = [ "defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"]  }
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
log = "0.4"

[build-dependencies]
femtopb-build = "0.6.0"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
